# Live nginx vhost for https://yardex.fmcv.my
#
# This host terminates 80/443 on the lazystorage-nginx edge container
# (mounted config: /root/lazystorage/nginx/lazystorage-http.conf). These
# server blocks are appended to that file, and the nginx container is
# attached to the fencevisionpro_default network so it can resolve the
# yardex_* container names. TLS certs are issued/renewed by the
# lazystorage-certbot container via webroot (/var/www/certbot).

server {
    listen 80;
    server_name yardex.fmcv.my;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://yardex.fmcv.my$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yardex.fmcv.my;

    ssl_certificate /etc/letsencrypt/live/yardex.fmcv.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yardex.fmcv.my/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FenceSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # Customer-shareable PDFs are served by the backend (no auth).
    location /public/ {
        proxy_pass http://yardex_backend:3000/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 20M;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # The SPA calls /api/... ; strip the prefix so NestJS sees /ai/..., /auth/..., etc.
    location /api/ {
        proxy_pass http://yardex_backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        proxy_pass http://yardex_backend:3000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://yardex_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
